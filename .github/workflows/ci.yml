name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `check` runs the manifest guard, parses every entry point and runs the tests.
      - name: Check
        run: npm run check

      - name: Pack
        run: npm pack --json > pack.json

      # A file that is missing from `files` only fails after a user installs the
      # tarball, so the listing is asserted here instead.
      - name: Verify the tarball content
        run: |
          TARBALL=$(node -e "console.log(require('./pack.json')[0].filename)")
          echo "tarball: $TARBALL"
          tar -tzf "$TARBALL" | tee listing.txt
          for file in index.js client.js update.js cordis.patch.yml; do
            grep -qx "package/$file" listing.txt || { echo "missing package/$file"; exit 1; }
          done

      # A tarball can be well formed and still be unusable as a package: this
      # installs it the way a consumer would and checks what actually lands.
      - name: Install the tarball into a scratch directory
        run: |
          TARBALL=$(node -e "console.log(require('./pack.json')[0].filename)")
          SCRATCH="$RUNNER_TEMP/consumer"
          mkdir -p "$SCRATCH"
          cd "$SCRATCH"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$OLDPWD/$TARBALL" > /dev/null
          node -e '
            const { readFileSync } = require("node:fs");
            const pkg = require("./node_modules/dsh-active-sessions/package.json");
            for (const file of ["index.js", "client.js", "update.js", "cordis.patch.yml"]) {
              readFileSync(`./node_modules/dsh-active-sessions/${file}`);
            }
            console.log(`installed ${pkg.name}@${pkg.version}`);
          '

      # A real profile install needs a DSH installation with its own resolver, so
      # it runs on the maintainer machine (npm run channel + a local host) rather
      # than on a bare runner where the @deepseek-ai packages are not published.

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
