name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `check` runs the manifest guard, parses every entry point and runs the tests.
      - name: Check
        run: npm run check

      - name: Pack
        run: npm pack --json > pack.json

      # A file that is missing from `files` only fails after a user installs the
      # tarball, so the listing is asserted here instead.
      - name: Verify the tarball content
        run: |
          TARBALL=$(node -e "console.log(require('./pack.json')[0].filename)")
          echo "tarball: $TARBALL"
          tar -tzf "$TARBALL" | tee listing.txt
          for file in index.js client.js update.js respawn.cjs cordis.patch.yml; do
            grep -qx "package/$file" listing.txt || { echo "missing package/$file"; exit 1; }
          done

      - name: Install into a throwaway profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          TARBALL=$(node -e "console.log(require('./pack.json')[0].filename)")
          npx -y --package @deepseek-ai/dsh dsh plugin --profile web add "$PWD/$TARBALL"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
